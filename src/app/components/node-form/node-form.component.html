<div class="node-form-container">
    <div class="form-header">
        <h1>{{ isEditMode ? 'Edit Node' : 'Create New Node' }}</h1>
    </div>

    <form [formGroup]="nodeForm" (ngSubmit)="onSubmit()" class="node-form">
        <div class="form-group">
            <label for="name">Name <span class="required">*</span></label>
            <input type="text" id="name" formControlName="name" class="form-control"
                [class.error]="name?.invalid && name?.touched" placeholder="Enter node name" />
            <div class="error-message" *ngIf="name?.invalid && name?.touched">
                <span *ngIf="name?.errors?.['required']">Name is required</span>
                <span *ngIf="name?.errors?.['minlength']">Name must be at least 3 characters</span>
            </div>
        </div>

        <div class="form-group">
            <label for="description">Description <span class="required">*</span></label>
            <textarea id="description" formControlName="description" class="form-control"
                [class.error]="description?.invalid && description?.touched" placeholder="Enter node description"
                rows="4"></textarea>
            <div class="error-message" *ngIf="description?.invalid && description?.touched">
                <span *ngIf="description?.errors?.['required']">Description is required</span>
                <span *ngIf="description?.errors?.['minlength']">Description must be at least 5 characters</span>
            </div>
        </div>

        <div class="form-actions">
            <button type="button" class="btn btn-cancel" (click)="onCancel()">
                Cancel
            </button>
            <button type="submit" class="btn btn-submit" [disabled]="nodeForm.invalid">
                {{ isEditMode ? 'Update' : 'Create' }}
            </button>
        </div>
    </form>
</div>
